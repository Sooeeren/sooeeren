    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12805a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0f8f9a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2512a" stop-opacity="0.5"/>
