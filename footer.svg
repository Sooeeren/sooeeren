    <filter id="blur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
    .scene { opacity: 0; animation: fadein 1.6s ease-out forwards; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .w1 { animation: drift1 18s ease-in-out infinite alternate; }
    .w2 { animation: drift2 24s ease-in-out infinite alternate; }
    .w3 { animation: drift3 30s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(-70px, 0); } to { transform: translate(70px, -6px); } }
    @keyframes drift2 { from { transform: translate(60px, -4px); } to { transform: translate(-80px, 4px); } }
    @keyframes drift3 { from { transform: translate(-50px, 3px); } to { transform: translate(90px, -3px); } }
    .p { fill: #fff; opacity: 0; animation: rise var(--d,18s) linear var(--del,0s) infinite; }
    @keyframes rise {
      0%   { transform: translateY(0);      opacity: var(--o,.7); }
      80%  { opacity: var(--o,.7); }
      100% { transform: translateY(-190px); opacity: 0; }
    }
  </style>
