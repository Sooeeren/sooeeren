<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="840" height="130" role="img" aria-label="Thanks for stopping by">
  <title>Footer</title>
  <defs>
    <clipPath id="clip"><rect x="0.5" y="0.5" width="839" height="129" rx="16"/></clipPath>
    <radialGradient id="teal" cx="0.5" cy="1.3" r="0.8">
      <stop offset="0" stop-color="#0f8f9a" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#0f8f9a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0f8f9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="1" cy="1.1" r="0.6">
      <stop offset="0" stop-color="#d9822b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#d9822b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d9822b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .card { opacity: 0; animation: fadein 1.4s ease-out forwards; }
    .txt  { opacity: 0; animation: fadein 1.6s ease-out .6s forwards; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .glow { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
    .p { fill: #fff; opacity: 0; animation: rise var(--d,18s) linear var(--del,0s) infinite; }
    @keyframes rise {
      0%   { transform: translateY(0);      opacity: var(--o,.7); }
      80%  { opacity: var(--o,.7); }
      100% { transform: translateY(-150px); opacity: 0; }
    }
  </style>
  <g class="card">
    <rect x="0.5" y="0.5" width="839" height="129" rx="16" fill="#0b1214" stroke="#1b2a2c"/>
    <g clip-path="url(#clip)">
      <rect class="glow" width="840" height="130" fill="url(#teal)"/>
      <rect class="glow" width="840" height="130" fill="url(#amber)"/>
      <circle class="p" cx="192" cy="145" r="1.8" style="--d:21.6s;--del:-10.3s;--o:0.55"/>
      <circle class="p" cx="510" cy="148" r="1.1" style="--d:20.3s;--del:-16.0s;--o:0.46"/>
      <circle class="p" cx="623" cy="145" r="1.0" style="--d:23.5s;--del:-5.5s;--o:0.55"/>
      <circle class="p" cx="67" cy="145" r="2.2" style="--d:22.9s;--del:-20.0s;--o:0.73"/>
      <circle class="p" cx="58" cy="142" r="1.6" style="--d:22.3s;--del:-14.5s;--o:0.87"/>
      <circle class="p" cx="47" cy="136" r="1.9" style="--d:15.1s;--del:-12.2s;--o:0.46"/>
      <circle class="p" cx="188" cy="149" r="1.8" style="--d:18.8s;--del:-2.8s;--o:0.75"/>
      <circle class="p" cx="505" cy="139" r="1.0" style="--d:16.4s;--del:-11.1s;--o:0.81"/>
      <circle class="p" cx="697" cy="150" r="2.2" style="--d:14.9s;--del:-8.3s;--o:0.7"/>
      <circle class="p" cx="421" cy="138" r="1.3" style="--d:15.8s;--del:-8.5s;--o:0.58"/>
      <circle class="p" cx="486" cy="148" r="1.4" style="--d:25.9s;--del:-10.0s;--o:0.46"/>
      <circle class="p" cx="119" cy="137" r="1.8" style="--d:25.9s;--del:-12.8s;--o:0.67"/>
      <circle class="p" cx="587" cy="148" r="1.2" style="--d:21.3s;--del:-11.9s;--o:0.73"/>
      <circle class="p" cx="209" cy="137" r="1.7" style="--d:24.0s;--del:-8.0s;--o:0.79"/>
      <circle class="p" cx="337" cy="139" r="1.0" style="--d:14.8s;--del:-12.0s;--o:0.8"/>
      <circle class="p" cx="407" cy="137" r="1.8" style="--d:22.1s;--del:-19.9s;--o:0.88"/>
      <circle class="p" cx="440" cy="137" r="2.1" style="--d:21.1s;--del:-18.6s;--o:0.67"/>
      <circle class="p" cx="408" cy="139" r="2.1" style="--d:17.0s;--del:-9.6s;--o:0.65"/>
    </g>
    <g class="txt">
      <rect x="270" y="30" width="300" height="1.5" rx="1" fill="url(#hair)"/>
      <text x="420" y="64" font-size="17" font-weight="600" fill="#eafff6">Thanks for stopping by</text>
      <text x="421" y="88" font-size="11" font-weight="600" letter-spacing="3" fill="#2dd4bf">SOOEEREN  ·  VIBE CODING</text>
    </g>
  </g>
</svg>
