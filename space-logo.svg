    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4fff0"/>
    </linearGradient>
      <filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <style>
    .scene { opacity: 0; animation: fadein 2.2s ease-out forwards; }
    .logo  { opacity: 0; animation: rise 1.8s cubic-bezier(.2,.7,.2,1) .6s forwards; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(10px); }
                        to   { opacity: 1; transform: translateY(0); } }

    .glow { animation: pulse 6s ease-in-out infinite; transform-origin: 420px 220px; }
    @keyframes pulse { 0%, 100% { opacity: .75; transform: scale(1); }
                       50%      { opacity: 1;   transform: scale(1.08); } }

    .p { fill: #fff; opacity: 0; animation: rise-dot var(--d,10s) linear var(--del,0s) infinite; }
    .b { filter: url(#soft); }
    @keyframes rise-dot {
      0%   { transform: translateY(0);      opacity: var(--o,.8); }
      85%  { opacity: var(--o,.8); }
      100% { transform: translateY(-540px); opacity: 0; }
    }
    .tw { animation-name: rise-dot, flick; animation-duration: var(--d,10s), 1.6s;
          animation-timing-function: linear, ease-in-out; animation-delay: var(--del,0s), var(--del,0s);
          animation-iteration-count: infinite, infinite; }
    @keyframes flick { 0%,100% { fill: #fff; } 50% { fill: #ffd9e8; } }

    .word { opacity: 0; animation: fadein 2s ease-out 1.8s forwards;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
    .name { font-size: 15px; font-weight: 600; letter-spacing: 9px; fill: #eafff6; }
    .tag  { font-size: 11.5px; letter-spacing: 2.5px; fill: #a9c9c3; opacity: .8; }
    .caret { animation: caret 3.2s ease-in-out infinite; }
    @keyframes caret { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }

    .g1 { animation: breathe 16s ease-in-out infinite; }
    .g2 { animation: breathe 21s ease-in-out -6s infinite; }
    .g3 { animation: breathe 18s ease-in-out -3s infinite; }
    .g4 { animation: breathe 24s ease-in-out -11s infinite; }
    @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  </style>

