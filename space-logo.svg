    <!-- monogram -->
    <g class="logo">
      <g transform="translate(420 220) skewX(-10) translate(-420 -220)">
        <path d="M 482 170 H 372 V 220 H 468 V 270 H 358"
              fill="none" stroke="url(#mark)" stroke-width="26"
              stroke-linejoin="miter" stroke-miterlimit="10"/>
        <path class="caret" d="M 404 296 H 482" fill="none" stroke="url(#mark)" stroke-width="5"/>
      </g>
    </g>

    <!-- wordmark -->
    <g class="word">
      <text class="name" x="424" y="346">SOOEEREN</text>
