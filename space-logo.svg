    <!-- gradient background -->
    <rect width="840" height="440" rx="20" fill="#04090a"/>
    <rect class="g1" width="840" height="440" rx="20" fill="url(#blue)"/>
    <rect class="g2" width="840" height="440" rx="20" fill="url(#violet)"/>
    <rect class="g3" width="840" height="440" rx="20" fill="url(#crimson)"/>
    <rect class="g4" width="840" height="440" rx="20" fill="url(#magenta)"/>
    <rect width="840" height="440" rx="20" fill="url(#vignette)"/>

    <!-- soft glow behind the mark -->
    <circle class="glow" cx="420" cy="220" r="190" fill="url(#glow)"/>

